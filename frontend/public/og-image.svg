<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="boxgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glow Spheres -->
  <circle cx="200" cy="150" r="180" fill="#3b82f6" opacity="0.18" filter="url(#glow)" />
  <circle cx="1000" cy="450" r="220" fill="#6366f1" opacity="0.22" filter="url(#glow)" />

  <!-- Grid Pattern Overlay -->
  <g stroke="#334155" stroke-width="1" opacity="0.2">
    <path d="M0 70 H1200 M0 140 H1200 M0 210 H1200 M0 280 H1200 M0 350 H1200 M0 420 H1200 M0 490 H1200 M0 560 H1200" />
    <path d="M100 0 V630 M200 0 V630 M300 0 V630 M400 0 V630 M500 0 V630 M600 0 V630 M700 0 V630 M800 0 V630 M900 0 V630 M1000 0 V630 M1100 0 V630" />
  </g>

  <!-- Brand Badge -->
  <g transform="translate(100, 100)">
    <rect width="360" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
    <circle cx="24" cy="21" r="6" fill="#10b981" />
    <text x="42" y="27" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="1">GOOGLE AD MANAGER SOAP API v202511</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(100, 220)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="800" letter-spacing="-1">
      Ad Trafficking Automation
    </text>
    <text x="0" y="70" fill="url(#accent)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="800" letter-spacing="-1">
      Next-Gen Campaign Engine
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(100, 360)">
    <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">
      Automate Orders, Line Items, Creatives, LICAs, and GPT tags across multi-network publishers.
    </text>
  </g>

  <!-- Feature Cards Row -->
  <g transform="translate(100, 430)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="220" height="90" rx="16" fill="url(#boxgrad)" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="38" fill="#38bdf8" font-family="sans-serif" font-size="24" font-weight="bold">⚡ 1-Click</text>
    <text x="24" y="66" fill="#cbd5e1" font-family="sans-serif" font-size="14">Order &amp; Line Item</text>

    <!-- Card 2 -->
    <rect x="250" y="0" width="220" height="90" rx="16" fill="url(#boxgrad)" stroke="#334155" stroke-width="1.5" />
    <text x="274" y="38" fill="#818cf8" font-family="sans-serif" font-size="24" font-weight="bold">📐 Multi-Size</text>
    <text x="274" y="66" fill="#cbd5e1" font-family="sans-serif" font-size="14">Auto Creative Resizer</text>

    <!-- Card 3 -->
    <rect x="500" y="0" width="220" height="90" rx="16" fill="url(#boxgrad)" stroke="#334155" stroke-width="1.5" />
    <text x="524" y="38" fill="#c084fc" font-family="sans-serif" font-size="24" font-weight="bold">🏷️ GPT Tags</text>
    <text x="524" y="66" fill="#cbd5e1" font-family="sans-serif" font-size="14">Infinite Scroll Ready</text>

    <!-- Card 4 -->
    <rect x="750" y="0" width="220" height="90" rx="16" fill="url(#boxgrad)" stroke="#334155" stroke-width="1.5" />
    <text x="774" y="38" fill="#34d399" font-family="sans-serif" font-size="24" font-weight="bold">🔒 Scoped</text>
    <text x="774" y="66" fill="#cbd5e1" font-family="sans-serif" font-size="14">Role &amp; Partner Scoping</text>
  </g>
</svg>
